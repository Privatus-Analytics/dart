name: privatus_analytics
description: >-
  Adds the cookieless Privatus Analytics script to Dart websites: a script tag
  builder, event and click map attributes, page props, a shelf middleware and a
  Flutter web helper. It never sends events from your server.
version: 1.0.0
homepage: https://privatusanalytics.com
repository: https://github.com/Privatus-Analytics/dart
issue_tracker: https://github.com/Privatus-Analytics/dart/issues
documentation: https://privatusanalytics.com/docs
topics:
  - analytics
  - privacy
  - shelf
  - jaspr
  - flutter

environment:
  sdk: ^3.3.0

dependencies:
  shelf: ^1.4.0
  web: ">=0.5.1 <2.0.0"

dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  test: ^1.24.0
